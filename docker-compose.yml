# ==========================================
# LunaTV 生产环境 Docker Compose 配置文件
# ==========================================
version: '3.8'

services:
  # 1. LunaTV 核心应用
  moontv-core:
    image: ghcr.io/moontechlab/lunatv:latest
    # 如果后续需要自行编译修改后的代码，可注释上方 image 并取消下方注释：
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: moontv-core
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - USERNAME=${USERNAME:-admin}
      - PASSWORD=${PASSWORD:-admin123456}
      - NEXT_PUBLIC_STORAGE_TYPE=kvrocks
      - KVROCKS_URL=redis://moontv-kvrocks:6666
      - SITE_BASE=${SITE_BASE:-http://localhost:3000}
      - NEXT_PUBLIC_SITE_NAME=${SITE_NAME:-LunaTV}
      - ANNOUNCEMENT=${ANNOUNCEMENT:-欢迎使用 LunaTV！}
      - NEXT_PUBLIC_DOUBAN_PROXY_TYPE=${DOUBAN_PROXY_TYPE:-cmliussss-cdn-tencent}
      - NEXT_PUBLIC_DOUBAN_IMAGE_PROXY_TYPE=${DOUBAN_IMAGE_PROXY_TYPE:-cmliussss-cdn-tencent}
      - NEXT_PUBLIC_SEARCH_MAX_PAGE=${SEARCH_MAX_PAGE:-5}
      - NEXT_PUBLIC_FLUID_SEARCH=true
    networks:
      - moontv-network
    depends_on:
      - moontv-kvrocks

  # 2. 持久化存储 (Kvrocks: 官方推荐，基于磁盘存储的 Redis 协议数据库，低内存防丢失)
  moontv-kvrocks:
    image: apache/kvrocks:latest
    container_name: moontv-kvrocks
    restart: unless-stopped
    volumes:
      - kvrocks-data:/var/lib/kvrocks/db
    networks:
      - moontv-network

  # 3. 反向代理与自动 HTTPS (Caddy: 自动申请并续签 Let's Encrypt 证书)
  # 如果你的 VPS 已经安装了 Nginx/宝塔/1Panel 占用了 80/443 端口，可以停用此 caddy 服务并使用现有 Nginx 反代 3000 端口
  caddy:
    image: caddy:alpine
    container_name: moontv-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - moontv-network
    depends_on:
      - moontv-core

networks:
  moontv-network:
    driver: bridge

volumes:
  kvrocks-data:
  caddy-data:
  caddy-config:
